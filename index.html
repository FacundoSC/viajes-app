<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Kiora Colectivo Filtros</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <h1>Filtros de Viajes</h1>

    <!-- Mostramos la fecha y hora en la parte superior -->
    <div id="fecha-hora">
        <p><strong>Fecha y Hora Actual: </strong><span id="fecha"></span> <span id="hora"></span></p>
    </div>

    <div class="filter-container">

        <!-- Contenedor 1 -->
        <div class="filter-box">
            <h2>FLORIDA → S. M. DE TUCUMÁN</h2>
            <label for="parada">Parada:</label>
            <select id="parada">
                <option value="todos">TODOS</option>
                <option value="alderetes">ALDERETES</option>
                <option value="banda">BANDA DEL RÍO SALÍ</option>
                <option value="posse">W. POSSE</option>
                <option value="alternativa">ALTERNATIVA</option>
            </select>

            <div class="trip-type">
                <p>Tipo de viaje:</p>
                <button class="btn-ida" id="ida-vuelta1" data-value="ida">Ida</button>
                <button class="btn-vuelta" id="ida-vuelta1" data-value="vuelta">Vuelta</button>
            </div>
        </div>

        <!-- Contenedor 2 -->
        <div class="filter-box">
            <h2>W. POSSE → S. M. DE TUCUMÁN</h2>

            <div class="trip-type">
                <p>Tipo de viaje:</p>
                <button class="btn-ida" id="ida-vuelta2" data-value="ida">Ida</button>
                <button class="btn-vuelta" id="ida-vuelta2" data-value="vuelta">Vuelta</button>
            </div>
        </div>

        <!-- Contenedor 3 -->
        <div class="filter-box">
            <h2>Filtro personalizado</h2>

            <label for="origen">Origen:</label>
            <select id="origen">
                <option value="">Seleccione origen</option>
                <option value="florida">FLORIDA</option>
                <option value="posse">W. POSSE</option>
                <option value="banda">BANDA DEL RÍO SALÍ</option>
            </select>

            <label for="destino">Destino:</label>
            <select id="destino">
                <option value="">Seleccione destino</option>
                <option value="tucuman">S. M. DE TUCUMÁN</option>
                <option value="alderetes">ALDERETES</option>
            </select>

            <div class="trip-type">
                <p>Tipo de viaje:</p>
                <button class="btn-ida" id="ida-vuelta3" data-value="ida">Ida</button>
                <button class="btn-vuelta" id="ida-vuelta3" data-value="vuelta">Vuelta</button>
            </div>
        </div>

    </div>

    <script src="js/app.js"></script>
</body>

</html>
