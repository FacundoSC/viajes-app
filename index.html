<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Consulta de horarios y tarifas de viajes - Proyecto de Facundo Sebastian Cordoba">
    <meta name="author" content="Facundo Sebastian Cordoba">
    <title>Viajes App | Facundo Sebastian Cordoba</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <h1>Filtros de Viajes</h1>

    <!-- Mostramos la fecha y hora en la parte superior -->
    <div id="fecha-hora">
        <p><strong>Fecha y Hora Actual: </strong><span id="fecha"></span> <span id="hora"></span></p>
    </div>

    <div class="main-container">
        <!-- Barra de Navegación -->
        <nav class="navigation-bar">
            <button class="nav-btn" data-route="florida-tucuman">FLORIDA → S. M. DE TUCUMÁN</button>
            <button class="nav-btn" data-route="tucuman-florida">S. M. DE TUCUMÁN → FLORIDA</button>
            <button class="nav-btn" data-route="posse-tucuman">W. POSSE → S. M. DE TUCUMÁN</button>
            <button class="nav-btn" data-route="tucuman-posse">S. M. DE TUCUMÁN → W. POSSE</button>
            <button class="nav-btn" id="btn-tarifario">TARIFARIO</button>
            <button class="nav-btn" id="btn-contacto">CONTACTO</button>
        </nav>

        <!-- Contenedor de Resultados (Tabla Inline) -->
        <div id="results-container" class="results-container">
            <!-- La tabla se inyectará aquí -->
        </div>

        <!-- Contenedor Filtro Personalizado (Oculto por defecto) -->
        <div id="personalizado-container" class="filter-container hidden">
            <div class="filter-box">
                <h2>Filtro personalizado</h2>

                <label for="origen">Origen:</label>
                <select id="origen">
                    <option value="">Seleccione origen</option>
                    <option value="florida">FLORIDA</option>
                    <option value="posse">W. POSSE</option>
                    <option value="banda">BANDA DEL RÍO SALÍ</option>
                </select>

                <label for="destino">Destino:</label>
                <select id="destino">
                    <option value="">Seleccione destino</option>
                    <option value="tucuman">S. M. DE TUCUMÁN</option>
                    <option value="alderetes">ALDERETES</option>
                </select>

                <div class="trip-type">
                    <p>Tipo de viaje:</p>
                    <button class="btn-ida" id="ida-vuelta3" data-value="ida">Ida</button>
                    <button class="btn-vuelta" id="ida-vuelta3" data-value="vuelta">Vuelta</button>
                </div>
            </div>
        </div>
    </div>



    <!-- Modal para Histograma de Tarifas -->
    <div id="history-modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Historial de Precios</h2>
                <span class="close-modal">&times;</span>
            </div>
            <div id="histogram-container" class="histogram-container">
                <!-- El histograma se dibujará aquí -->
            </div>
        </div>
    </div>

    <!-- Modal Formulario de Contacto -->
    <div id="contact-modal" class="modal hidden">
        <div class="modal-content contact-modal-content">
            <div class="modal-header">
                <h2>Contacto</h2>
                <span class="close-contact-modal">&times;</span>
            </div>
            <form id="contact-form" enctype="multipart/form-data">
                <input type="hidden" name="access_key" value="EMAIL_KEY_HERE">
                <input type="hidden" name="from_name" value="Viajes App - Contacto">
                <input type="hidden" name="subject" id="hidden-subject" value="">

                <div class="form-group">
                    <label for="contact-nombre">Nombre</label>
                    <input type="text" id="contact-nombre" name="name" placeholder="Tu nombre" required>
                </div>

                <div class="form-group">
                    <label for="contact-email">Email</label>
                    <input type="email" id="contact-email" name="email" placeholder="tu@email.com" required>
                </div>

                <div class="form-group">
                    <label for="contact-asunto">Asunto</label>
                    <input type="text" id="contact-asunto" name="asunto" placeholder="Asunto del mensaje" required>
                </div>

                <div class="form-group">
                    <label for="contact-mensaje">Mensaje</label>
                    <textarea id="contact-mensaje" name="message" rows="5" placeholder="Escribe tu mensaje aquí..." required></textarea>
                </div>

                <div class="form-group">
                    <label for="contact-adjuntos">Adjuntar archivos (imágenes, documentos, etc.)</label>
                    <div class="file-upload-area" id="file-drop-zone">
                        <input type="file" id="contact-adjuntos" name="attachment" multiple accept="image/*,.pdf,.doc,.docx,.xls,.xlsx,.txt,.zip">
                        <p class="file-upload-text">Arrastra archivos aquí o haz clic para seleccionar</p>
                        <p class="file-upload-hint">Máx. 5MB por archivo</p>
                    </div>
                    <div id="file-list" class="file-list"></div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn-enviar" id="btn-enviar">Enviar</button>
                    <button type="button" class="btn-cancelar" id="btn-cancelar-contacto">Cancelar</button>
                </div>

                <div id="contact-status" class="contact-status hidden"></div>
            </form>
        </div>
    </div>

    <script src="js/app.js"></script>
    <footer class="minimal-footer">
        <div class="footer-content">
            <p>&copy; 2026 Designed & Developed by <strong>Facundo Sebastian Cordoba</strong></p>
            <div class="footer-links">
                <a href="mailto:cordobafs.dev@gmail.com">Contacto</a>
            </div>
        </div>
    </footer>
</body>

</html>
