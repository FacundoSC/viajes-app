<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Consulta de horarios y tarifas de viajes - Proyecto de Facundo Sebastian Cordoba">
    <meta name="author" content="Facundo Sebastian Cordoba">
    <title>Viajes App | Facundo Sebastian Cordoba</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <h1>Filtros de Viajes</h1>

    <!-- Mostramos la fecha y hora en la parte superior -->
    <div id="fecha-hora">
        <p><strong>Fecha y Hora Actual: </strong><span id="fecha"></span> <span id="hora"></span></p>
    </div>

    <div class="main-container">
        <!-- Barra de Navegación -->
        <nav class="navigation-bar">
            <button class="nav-btn" data-route="florida-tucuman">FLORIDA → S. M. DE TUCUMÁN</button>
            <button class="nav-btn" data-route="tucuman-florida">S. M. DE TUCUMÁN → FLORIDA</button>
            <button class="nav-btn" data-route="posse-tucuman">W. POSSE → S. M. DE TUCUMÁN</button>
            <button class="nav-btn" data-route="tucuman-posse">S. M. DE TUCUMÁN → W. POSSE</button>
            <button class="nav-btn" id="btn-tarifario">TARIFARIO</button>
            <button class="nav-btn" id="btn-contacto"
                onclick="window.location.href='mailto:cordobafs.dev@gmail.com?subject=Sugerencia%20Viajes-App'">CONTACTO</button>
        </nav>

        <!-- Contenedor de Resultados (Tabla Inline) -->
        <div id="results-container" class="results-container">
            <!-- La tabla se inyectará aquí -->
        </div>

        <!-- Contenedor Filtro Personalizado (Oculto por defecto) -->
        <div id="personalizado-container" class="filter-container hidden">
            <div class="filter-box">
                <h2>Filtro personalizado</h2>

                <label for="origen">Origen:</label>
                <select id="origen">
                    <option value="">Seleccione origen</option>
                    <option value="florida">FLORIDA</option>
                    <option value="posse">W. POSSE</option>
                    <option value="banda">BANDA DEL RÍO SALÍ</option>
                </select>

                <label for="destino">Destino:</label>
                <select id="destino">
                    <option value="">Seleccione destino</option>
                    <option value="tucuman">S. M. DE TUCUMÁN</option>
                    <option value="alderetes">ALDERETES</option>
                </select>

                <div class="trip-type">
                    <p>Tipo de viaje:</p>
                    <button class="btn-ida" id="ida-vuelta3" data-value="ida">Ida</button>
                    <button class="btn-vuelta" id="ida-vuelta3" data-value="vuelta">Vuelta</button>
                </div>
            </div>
        </div>
    </div>



    <script src="js/app.js"></script>
    <footer class="minimal-footer">
        <div class="footer-content">
            <p>&copy; 2026 Designed & Developed by <strong>Facundo Sebastian Cordoba</strong></p>
            <div class="footer-links">
                <a href="mailto:cordobafs.dev@gmail.com">Contacto</a>
            </div>
        </div>
    </footer>
</body>

</html>
